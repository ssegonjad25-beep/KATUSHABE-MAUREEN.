<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Bean & Brew</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--espresso:#4a2c2a;--caramel:#c68b59;--cream:#fdf6ec;--mocha:#2b1d16;--soft:#f3e4d4}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--mocha);line-height:1.6}
  nav{background:var(--espresso);padding:15px;text-align:center;position:sticky;top:0;z-index:100}
  nav a{color:var(--cream);text-decoration:none;margin:0 10px;font-weight:600;font-size:15px;padding:6px 4px;border-bottom:2px solid transparent;transition:.3s}
  nav a:hover,nav a.active{color:var(--caramel);border-bottom:2px solid var(--caramel)}
  header{background:linear-gradient(135deg,var(--espresso),#6b4038);color:#fff;text-align:center;padding:60px 20px}
  header h1{font-size:2.2em;letter-spacing:2px}
  header p{color:var(--caramel);font-style:italic;margin-top:8px}
  main{max-width:1100px;margin:40px auto;padding:0 20px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:30px 0}
  .gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px;cursor:pointer;transition:transform .5s,box-shadow .5s;box-shadow:0 4px 14px rgba(74,44,42,.15)}
  .gallery img:hover{transform:scale(1.06) rotate(1deg);box-shadow:0 16px 36px rgba(74,44,42,.3)}
  footer{background:var(--espresso);color:var(--cream);text-align:center;padding:20px;margin-top:40px;font-size:14px}
  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);justify-content:center;align-items:center;z-index:999}
  #lightbox img{max-width:92%;max-height:88%;border-radius:12px}
</style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="welcome.html">Welcome</a>
  <a href="about.html">About</a>
  <a href="menu.html">Menu</a>
  <a href="gallery.html" class="active">Gallery</a>
  <a href="events.html">Events</a>
  <a href="reviews.html">Reviews</a>
  <a href="contact.html">Contact</a>
</nav>
<header>
  <h1>OUR GALLERY</h1>
  <p>A peek into Bean &amp; Brew</p>
</header>
<main>
  <div class="gallery">
    <img src="https://picsum.photos/id/431/500/400" alt="Coffee" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/225/500/400'">
    <img src="https://picsum.photos/id/425/500/400" alt="Interior" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/431/500/400'">
    <img src="https://picsum.photos/id/766/500/400" alt="Beans" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/225/500/400'">
    <img src="https://picsum.photos/id/1012/500/400" alt="Barista" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/431/500/400'">
    <img src="https://picsum.photos/id/30/500/400" alt="Latte" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/225/500/400'">
    <img src="https://picsum.photos/id/42/500/400" alt="Cafe" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/425/500/400'">
    <img src="https://picsum.photos/id/225/500/400" alt="Iced coffee" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/431/500/400'">
    <img src="https://picsum.photos/id/1080/500/400" alt="Cake" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/292/500/400'">
    <img src="https://picsum.photos/id/292/500/400" alt="Bread" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/312/500/400'">
    <img src="https://picsum.photos/id/312/500/400" alt="Croissant" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/292/500/400'">
    <img src="https://picsum.photos/id/1074/500/400" alt="Team" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/1012/500/400'">
    <img src="https://picsum.photos/id/488/500/400" alt="Food" onclick="openLightbox(this.src)" onerror="this.onerror=null;this.src='https://picsum.photos/id/292/500/400'">
  </div>
</main>
<footer>
  <p>Bean &amp; Brew Coffee Shop · Kampala, Uganda · 0703899625 · beanandbrew@gmail.com</p>
  <p>Open daily: 08:00 AM – 08:00 PM</p>
</footer>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" src="" alt="Enlarged"></div>

<script>
  function openLightbox(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').style.display='flex';}
  document.querySelectorAll('img').forEach(img=>{
    img.onerror=function(){this.onerror=null;this.src='https://picsum.photos/id/225/400/300';};
  });
</script>
</body>
</html>
